{%- if logo %}
<p class="logo">
  <a href="{{ pathto(master_doc) }}">
    <img class="logo" src="{{ pathto('_static/' + logo, 1) }}" alt="{{ project }}"/>
  </a>
</p>
{%- endif %}

<h1 class="logo">
  <a href="{{ pathto(master_doc) }}">{{ project }}</a>
</h1>

{%- if theme_description %}
<p class="blurb">{{ theme_description }}</p>
{%- endif %}
